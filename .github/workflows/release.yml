name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to rebuild (v1.2.3)
        required: true
        type: string

defaults:
  run:
    shell: bash

concurrency:
  group: swift-quit-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload-assets:
    name: Build universal macOS release
    if: github.repository == 'grievouz/swift-quit'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Test quit safety and preferences
        run: swift test
      - name: Test release tooling
        run: python3 -m unittest discover -s Tests/ReleaseTests
      - name: Build and verify universal release assets
        run: ./scripts/package-release.sh "$VERSION_TAG"
      - name: Upload release assets and matching source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$VERSION_TAG" \
            "build/release/swift-quit-${VERSION_TAG#v}-universal.dmg" \
            "build/release/swift-quit-${VERSION_TAG#v}-universal.zip" \
            "build/release/swift-quit-${VERSION_TAG#v}-source.tar.gz" \
            build/release/SHA256SUMS --clobber

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: upload-assets
    if: github.repository == 'grievouz/swift-quit'
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Check tap token is configured
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "Set HOMEBREW_TAP_TOKEN with Contents read/write on grievouz/homebrew-tap." >&2
            exit 1
          fi
      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: grievouz/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: true
      - name: Download and verify release DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$VERSION_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          mkdir -p release-assets
          gh release download "$VERSION_TAG" \
            -p "swift-quit-${VERSION_TAG#v}-universal.dmg" -p SHA256SUMS -D release-assets
          cd release-assets
          sha256sum --check --ignore-missing SHA256SUMS
      - name: Update cask
        run: |
          python3 scripts/update-homebrew-cask.py "$VERSION_TAG" \
            "release-assets/swift-quit-${VERSION_TAG#v}-universal.dmg" homebrew-tap
          ruby -c homebrew-tap/Casks/swift-quit.rb
      - name: Push tap update
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/swift-quit.rb
          if git diff --cached --quiet; then
            echo "Cask is already current."
            exit 0
          fi
          git commit -m "swift-quit ${VERSION_TAG#v}"
          git pull --rebase origin main
          git push origin HEAD:main
